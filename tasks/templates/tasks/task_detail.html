<h1>{{ task.task }}</h1>
<p><strong>Detalle:</strong> {{ task.detail }}</p>
<p><strong>Repetir:</strong> {{ task.repeat }}</p>
<p><strong>Fecha:</strong> {{ task.date }}</p>
<p><strong>Hora:</strong> {{ task.time }}</p>
<a href="{% url 'task-edit' task.id %}">✏ Editar</a>
<form method="post" action="{% url 'task-delete' task.id %}">
  {% csrf_token %}
  <button type="submit">🗑 Eliminar</button>
</form>
<a href="{% url 'list-list' %}">⬅ Volver</a>
