<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Latest Tags</title>
  </head>
  <body>
    <h1>Latest Tags</h1>

    {% if latest_tag_list %}
      <ul>
        {% for tag in latest_tag_list %}
          <li><a href="{% url 'keeps:detail' tag.id %}">[{{ tag.id }}] {{ tag.tag_text }}</a></li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No tags are available.</p>
    {% endif %}
  </body>
</html>
